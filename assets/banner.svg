<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" font-family="Courier New, monospace">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#010409"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="280" fill="url(#bg)"/>
  <g fill="#00ff41" font-size="16" opacity="0.25">
    <text x="50" y="-60">01<animate attributeName="y" values="-60;340" dur="5s" begin="0s" repeatCount="indefinite"/></text>
    <text x="150" y="-60">10<animate attributeName="y" values="-60;340" dur="6.5s" begin="-2s" repeatCount="indefinite"/></text>
    <text x="250" y="-60">10<animate attributeName="y" values="-60;340" dur="4.2s" begin="-1s" repeatCount="indefinite"/></text>
    <text x="350" y="-60">01<animate attributeName="y" values="-60;340" dur="7s" begin="-3s" repeatCount="indefinite"/></text>
    <text x="450" y="-60">01<animate attributeName="y" values="-60;340" dur="5.6s" begin="-2.5s" repeatCount="indefinite"/></text>
    <text x="740" y="-60">10<animate attributeName="y" values="-60;340" dur="4.8s" begin="-1.5s" repeatCount="indefinite"/></text>
    <text x="840" y="-60">10<animate attributeName="y" values="-60;340" dur="6.2s" begin="-0.5s" repeatCount="indefinite"/></text>
    <text x="940" y="-60">01<animate attributeName="y" values="-60;340" dur="4.5s" begin="-2s" repeatCount="indefinite"/></text>
    <text x="1040" y="-60">01<animate attributeName="y" values="-60;340" dur="7.5s" begin="-4s" repeatCount="indefinite"/></text>
    <text x="1130" y="-60">10<animate attributeName="y" values="-60;340" dur="5.2s" begin="-1.2s" repeatCount="indefinite"/></text>
  </g>
  <text x="600" y="140" text-anchor="middle" font-size="76" font-weight="bold" fill="#00ff41" filter="url(#glow)" letter-spacing="14">NAVIDTOR</text>
  <text x="600" y="185" text-anchor="middle" font-size="20" fill="#7ee787" letter-spacing="3">defying fate, one commit at a time</text>
  <text x="600" y="232" text-anchor="middle" font-size="16" fill="#00ff41" opacity="0.85">$ whoami → cultivator of the wire<tspan> ▊<animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/></tspan></text>
</svg>
